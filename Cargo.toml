[workspace]
resolver = "2"
members = [
    "crates/kob-protocol",
    "crates/kob-wasm",
    "crates/kob-executor",
    "crates/kob-x402",
    "crates/kob-cli",
    "crates/kob-tests",
    "vendor/silverscript/silverscript-lang",
    "vendor/silverscript/silverscript-abi",
    "vendor/argent-artifact",
    "tools/sil2argent",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "ISC"
authors = ["RossKU"]
rust-version = "1.94"
publish = false

[workspace.dependencies]
# rusty-kaspa is pinned to the v2.1.0 release tag (covenants / tx v1 / compute budget).
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.1.0" }
kaspa-consensus = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.1.0" }
kaspa-addresses = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.1.0" }
kaspa-hashes = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.1.0" }
kaspa-muhash = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.1.0" }
kaspa-txscript = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.1.0" }
kaspa-txscript-errors = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.1.0" }
kaspa-txscript-zk-sdk = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.1.0" }

# vendored SilverScript v1.0.0 (see vendor/silverscript/UPSTREAM.md)
silverscript-lang = { path = "vendor/silverscript/silverscript-lang" }
silverscript-abi = { path = "vendor/silverscript/silverscript-abi" }
# vendored Argent artifact model, pinned upstream commit (see vendor/argent-artifact/UPSTREAM.md)
argent-artifact = { path = "vendor/argent-artifact" }

blake2b_simd = "1.0.2"
blake3 = "1.8.5"
faster-hex = "0.10"
indexmap = "2.7.0"
rand = "0.8.5"
secp256k1 = { version = "0.29.0", features = ["global-context", "rand-std", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
thiserror = "1.0.61"
wasm-bindgen = "0.2"

# wasm32-unknown-unknown randomness backends (used only under that target, see .cargo/config.toml)
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }

[profile.dev]
# The engine-level tests are CPU heavy; keep them quick and the target dir small.
opt-level = 1
debug = 0

[profile.release.package.kob-wasm]
opt-level = "s"
