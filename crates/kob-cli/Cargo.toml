[package]
name = "kob-cli"
description = "KOB command line: trading (place, replace, cancel, refund, take, send), token creation, live feed, registry check, order recovery, stray sweep"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

# The command line is called `kob` (`cargo build --release --bin kob`); the package keeps the name `kob-cli`.
[[bin]]
name = "kob"
path = "src/main.rs"

[dependencies]
kob-protocol = { path = "../kob-protocol" }
kaspa-addresses.workspace = true
kaspa-consensus-core.workspace = true
kaspa-txscript.workspace = true
secp256k1.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ctrlc = "3.5"
# https:// indexers and wss:// feeds: rustls with the ring provider and the webpki roots, as kob-executor uses them
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# public nodes serve the Borsh wRPC only (nodelink, the executor's rpc::bridge): the node's own RPC types and workflow-rpc framing
kaspa-rpc-core.workspace = true
workflow-serializer = "0.18.0"
borsh = "1"
rand.workspace = true
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

[dev-dependencies]
kaspa-hashes.workspace = true
serde.workspace = true

[features]
# The testnet-10 deployment templates (kob-protocol/deploy-tn10, see contracts/README.md).
deploy-tn10 = ["kob-protocol/deploy-tn10"]
# The mainnet deployment (kob-protocol/deploy-mainnet: contracts/deploy/mainnet, pinned registry; docs/ops/release.md).
deploy-mainnet = ["kob-protocol/deploy-mainnet"]
