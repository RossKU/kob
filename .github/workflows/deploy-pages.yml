name: deploy-pages

# The public web app on Cloudflare Pages (docs/ops/web-hosting.md). On a push to master that changes the app or its inputs, and on
# workflow_dispatch: the web app is built and tested exactly as the web job of ci.yml does, config.json is written from the repository
# variables KOB_PAGES_* (web/scripts/pages-config.mjs; on testnet-10 also the token-program list as registry/tokens.json), web/dist
# is uploaded to the Pages project KOB_PAGES_PROJECT (a Direct Upload project: the build needs Rust and wasm, so Cloudflare does not
# build it) and the live deployment is checked: the headers of public/_headers (CSP with frame-ancestors 'none', X-Frame-Options DENY,
# the signer page's own policy) and every file byte for byte (web/scripts/check-pages.mjs); any difference fails the job. The job
# summary lists the deployment URL and the sha256 of every deployed file.
#
# Two sites: the testnet-10 app (project KOB_PAGES_PROJECT, variables KOB_PAGES_*, https://kob-tn10.kaspa.ag) and the mainnet site (project
# KOB_PAGES_MAINNET_PROJECT, https://kob.kaspa.ag, always built with network mainnet). Mainnet is not launched, so the mainnet site is the LANDING-ONLY
# front page (KOB_LANDING_ONLY, web/src/app/landing-only.ts): "Mainnet - in preparation", a link to the testnet app, no trading UI, no wallet, no node or
# indexer connection, no signer page. That is set below, in this file, on the mainnet matrix entry (landing: "1"), not by a repository variable: the launch of
# mainnet is the reviewed commit that removes it (docs/ops/web-hosting.md, "The mainnet front page"). The landing-only page connects to nothing, so the
# mainnet site needs only KOB_PAGES_MAINNET_PROJECT; KOB_PAGES_MAINNET_INDEXER_URL (and _EXTRA_INDEXER_URLS, _NODE_URL, _EXPLORER_URL, _TOKEN_NAMES_URL)
# are optional and ignored until then. With the project unset nothing mainnet is built or published. A third site, the INTERNAL mainnet app
# (KOB_PAGES_MAINNET_INTERNAL=1, which also needs KOB_PAGES_MAINNET_INDEXER_URL), is the full mainnet app uploaded to the same project as a preview deployment on the
# branch `internal`, for the founder's own testing: the variable says the project's previews are behind Cloudflare Access (docs/ops/web-hosting.md, 4c), and the
# job fails when an unauthenticated request to it is not sent to Access (it also sends X-Robots-Tag: noindex and a robots.txt that disallows everything). Each site's custom domain is the host
# of its public URL (KOB_PAGES_PUBLIC_URL, KOB_PAGES_MAINNET_PUBLIC_URL): after the deployment web/scripts/pages-domain.mjs adds it to the
# project through the Pages API when it is not attached yet, and says exactly what is left to do in the dashboard when it cannot do it
# (the DNS CNAME, a domain that is still attached to another project).
#
# Without the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID or the variables KOB_PAGES_PROJECT and KOB_PAGES_INDEXER_URL
# (a fork, or before the setup) nothing is built: the job config says what is missing and the deploy job is skipped. A variable that
# is set but invalid fails the job config.
#
# The variables are not secrets: config.json is public. Never put an API key into a URL variable (the script refuses query strings).
#
# Gate: the signer page this deploys is where users type private keys, so production is deployed only from refs/heads/master (a run
# of any other ref, e.g. a workflow_dispatch from a branch, fails in the first step of job config), and job deploy runs in the GitHub
# environment `production`: Settings > Environments > production can require a reviewer (and limit the deployment branches to master)
# before the job starts (docs/ops/web-hosting.md, section 4a).

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - "crates/kob-wasm/**"
      - "crates/kob-protocol/**"
      - "vendor/**"
      - "contracts/**"
      - "registry/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/build-wasm.sh"
      - "scripts/build-deploy.sh"
      - "scripts/release-hashes.sh"
      - "scripts/lib/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# one deploy at a time; a newer push cancels the older run (the latest commit wins)
concurrency:
  group: deploy-pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  config:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      matrix: ${{ steps.gate.outputs.matrix }}
      branch: ${{ steps.gate.outputs.branch }}
    steps:
      - name: Production deploys only from master
        if: github.ref != 'refs/heads/master'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error title=deploy-pages::production is deployed only from refs/heads/master, not from $REF (docs/ops/web-hosting.md, section 4a)"
          exit 1
      - name: Cloudflare secrets and Pages variables (missing = the deploy is skipped)
        id: gate
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          PROJECT: ${{ vars.KOB_PAGES_PROJECT }}
          INDEXER: ${{ vars.KOB_PAGES_INDEXER_URL }}
          BRANCH: ${{ vars.KOB_PAGES_BRANCH }}
          NETWORK: ${{ vars.KOB_PAGES_NETWORK }}
          EXTRA: ${{ vars.KOB_PAGES_EXTRA_INDEXER_URLS }}
          NODE: ${{ vars.KOB_PAGES_NODE_URL }}
          EXPLORER: ${{ vars.KOB_PAGES_EXPLORER_URL }}
          NAMES: ${{ vars.KOB_PAGES_TOKEN_NAMES_URL }}
          PUBLIC: ${{ vars.KOB_PAGES_PUBLIC_URL }}
          MAIN_PROJECT: ${{ vars.KOB_PAGES_MAINNET_PROJECT }}
          MAIN_INDEXER: ${{ vars.KOB_PAGES_MAINNET_INDEXER_URL }}
          MAIN_EXTRA: ${{ vars.KOB_PAGES_MAINNET_EXTRA_INDEXER_URLS }}
          MAIN_NODE: ${{ vars.KOB_PAGES_MAINNET_NODE_URL }}
          MAIN_EXPLORER: ${{ vars.KOB_PAGES_MAINNET_EXPLORER_URL }}
          MAIN_NAMES: ${{ vars.KOB_PAGES_MAINNET_TOKEN_NAMES_URL }}
          MAIN_PUBLIC: ${{ vars.KOB_PAGES_MAINNET_PUBLIC_URL }}
          MAIN_INTERNAL: ${{ vars.KOB_PAGES_MAINNET_INTERNAL }}
        run: |
          missing=()
          [ "$HAS_TOKEN" = true ] || missing+=("secret CLOUDFLARE_API_TOKEN")
          [ "$HAS_ACCOUNT" = true ] || missing+=("secret CLOUDFLARE_ACCOUNT_ID")
          [ -n "$PROJECT" ] || missing+=("variable KOB_PAGES_PROJECT")
          [ -n "$INDEXER" ] || missing+=("variable KOB_PAGES_INDEXER_URL")
          if [ ${#missing[@]} -gt 0 ]; then
            {
              echo "## Cloudflare Pages deploy skipped"
              echo
              echo "Not configured in this repository (Settings > Secrets and variables > Actions):"
              echo
              for m in "${missing[@]}"; do echo "- $m"; done
              echo
              echo "Nothing was built or deployed. Setup: docs/ops/web-hosting.md."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=deploy-pages skipped::not configured: ${missing[*]} (docs/ops/web-hosting.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Pages project names: lower-case letters, digits and dashes; branch names: git-safe characters only
          if ! [[ "$PROJECT" =~ ^[a-z0-9][a-z0-9-]{0,57}$ ]]; then
            echo "::error::KOB_PAGES_PROJECT \`$PROJECT\` is not a Pages project name (a-z, 0-9 and -, at most 58 characters)"; exit 1
          fi
          BRANCH=${BRANCH:-main}
          if ! [[ "$BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$ ]]; then
            echo "::error::KOB_PAGES_BRANCH \`$BRANCH\` is not a branch name"; exit 1
          fi
          # the mainnet site: the project alone (the landing-only page needs no indexer); an indexer without a project is a mistake
          if [ -z "$MAIN_PROJECT" ] && [ -n "$MAIN_INDEXER" ]; then
            echo "::error::KOB_PAGES_MAINNET_INDEXER_URL is set without KOB_PAGES_MAINNET_PROJECT"; exit 1
          fi
          if [ -n "$MAIN_PROJECT" ]; then
            if ! [[ "$MAIN_PROJECT" =~ ^[a-z0-9][a-z0-9-]{0,57}$ ]]; then
              echo "::error::KOB_PAGES_MAINNET_PROJECT \`$MAIN_PROJECT\` is not a Pages project name (a-z, 0-9 and -, at most 58 characters)"; exit 1
            fi
            if [ "$MAIN_PROJECT" = "$PROJECT" ]; then
              echo "::error::KOB_PAGES_MAINNET_PROJECT must not be the testnet-10 project"; exit 1
            fi
          fi
          # the internal mainnet app (KOB_PAGES_MAINNET_INTERNAL=1): the full mainnet app as a PREVIEW deployment of the mainnet project on the fixed branch
          # `internal`, for the founder's own testing. The variable says the project's previews are behind Cloudflare Access (docs/ops/web-hosting.md, 4c); it
          # needs the mainnet project and the mainnet indexer, and the production branch must not be `internal` (that upload would be the public site)
          if [ -n "$MAIN_INTERNAL" ] && [ "$MAIN_INTERNAL" != 1 ]; then
            echo "::error::KOB_PAGES_MAINNET_INTERNAL must be 1 (previews are protected by Cloudflare Access) or unset, not \`$MAIN_INTERNAL\`"; exit 1
          fi
          if [ "$MAIN_INTERNAL" = 1 ]; then
            if [ -z "$MAIN_PROJECT" ] || [ -z "$MAIN_INDEXER" ]; then
              echo "::error::KOB_PAGES_MAINNET_INTERNAL=1 needs KOB_PAGES_MAINNET_PROJECT and KOB_PAGES_MAINNET_INDEXER_URL (the internal app is the full mainnet app)"; exit 1
            fi
            if [ "$BRANCH" = internal ]; then
              echo "::error::KOB_PAGES_BRANCH must not be \`internal\`: that branch is the protected preview of the internal mainnet app"; exit 1
            fi
          fi
          # one matrix entry per site; every value is a repository variable (not a secret), but `landing`: the mainnet site is landing-only (KOB_LANDING_ONLY)
          # until mainnet launches, and that is decided here, in the workflow file, not by a variable. `branch` is the Pages branch the site is uploaded to
          # (production: KOB_PAGES_BRANCH; the internal app: `internal`, a preview) and `internal` marks that preview
          matrix=$(jq -nc \
            --arg p "$PROJECT" --arg n "${NETWORK:-testnet-10}" --arg i "$INDEXER" --arg e "$EXTRA" --arg nd "$NODE" --arg ex "$EXPLORER" --arg nm "$NAMES" --arg u "$PUBLIC" --arg br "$BRANCH" \
            --arg mp "$MAIN_PROJECT" --arg mi "$MAIN_INDEXER" --arg me "$MAIN_EXTRA" --arg mnd "$MAIN_NODE" --arg mex "$MAIN_EXPLORER" --arg mnm "$MAIN_NAMES" --arg mu "$MAIN_PUBLIC" --arg mint "$MAIN_INTERNAL" \
            '{include: ([{site: "testnet", project: $p, network: $n, landing: "", branch: $br, internal: "", indexer: $i, extra: $e, node: $nd, explorer: $ex, names: $nm, public: $u}]
              + (if $mp != "" then [{site: "mainnet", project: $mp, network: "mainnet", landing: "1", branch: $br, internal: "", indexer: $mi, extra: $me, node: $mnd, explorer: $mex, names: $mnm, public: $mu}] else [] end)
              + (if $mp != "" and $mint == "1" then [{site: "mainnet-internal", project: $mp, network: "mainnet", landing: "", branch: "internal", internal: "1", indexer: $mi, extra: $me, node: $mnd, explorer: $mex, names: $mnm, public: ""}] else [] end))}')
          { echo "ready=true"; echo "branch=$BRANCH"; echo "matrix=$matrix"; } >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: The variables make a valid public config.json for every site (before anything is built)
        if: steps.gate.outputs.ready == 'true'
        env:
          MATRIX: ${{ steps.gate.outputs.matrix }}
        run: |
          rc=0
          while IFS= read -r site; do
            echo "== $(jq -r .site <<< "$site")"
            KOB_PAGES_NETWORK=$(jq -r .network <<< "$site") KOB_PAGES_LANDING_ONLY=$(jq -r .landing <<< "$site") KOB_PAGES_INDEXER_URL=$(jq -r .indexer <<< "$site") \
            KOB_PAGES_EXTRA_INDEXER_URLS=$(jq -r .extra <<< "$site") KOB_PAGES_NODE_URL=$(jq -r .node <<< "$site") \
            KOB_PAGES_EXPLORER_URL=$(jq -r .explorer <<< "$site") KOB_PAGES_TOKEN_NAMES_URL=$(jq -r .names <<< "$site") \
              node web/scripts/pages-config.mjs --check || rc=1
          done < <(jq -c '.include[]' <<< "$MATRIX")
          exit "$rc"

  deploy:
    needs: config
    if: needs.config.outputs.ready == 'true' && github.ref == 'refs/heads/master'
    name: deploy (${{ matrix.site }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.matrix) }}
    # a required reviewer of the environment approves here, before the job (and the Cloudflare secrets) start
    environment: production
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash # -eo pipefail: a failing command before a pipe fails the step
        working-directory: web
    steps:
      # build and test: the steps of the web job of ci.yml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master as of 2026-10-01 (the action has no release tags)
        with:
          toolchain: "1.94.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run fetch-sdk
      - name: kob-wasm bindings (installs wasm-bindgen-cli 0.2.100 under target/tools)
        working-directory: .
        run: bash scripts/build-wasm.sh --install-bindgen --web --slim
      - run: npm run build:wasm -- --copy
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # the e2e run builds dist/ for the mock stack, without the variables below: the release bundle comes after it, or the upload is that build
      - run: npm run e2e
        env:
          KOB_E2E_TARGET: app
      # the landing-only site: its own build (dist-landing/) must show the landing page at every address, offer no way into the app and request nothing but
      # its own files (web/e2e/landing); it runs for the entry that is landing-only
      - if: matrix.landing != ''
        run: npm run e2e:landing
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-playwright-report-${{ matrix.site }}
          path: |
            web/test-results
            web/playwright-report

      # the release bundle (vite build plus dist/registry/tokens.json, docs/ops/release.md 4); the link-preview head (web/head-meta.mjs) takes the
      # network and, when set, the public origin the deployment is served from (og:url, og:image)
      - run: npm run build:release
        env:
          KOB_NETWORK: ${{ matrix.network }}
          KOB_PUBLIC_URL: ${{ matrix.public }}
          KOB_LANDING_ONLY: ${{ matrix.landing }}
      - name: Release hashes (the deployment record reproduces, the bundle embeds and ships the registry the mainnet record pins)
        working-directory: .
        run: |
          bash scripts/release-hashes.sh > "$RUNNER_TEMP/release-hashes.md"
          cat "$RUNNER_TEMP/release-hashes.md"

      # the deployment: config.json from the repository variables
      - name: config.json from the repository variables (none for the landing-only site, whose page reads none)
        env:
          KOB_PAGES_NETWORK: ${{ matrix.network }}
          KOB_PAGES_LANDING_ONLY: ${{ matrix.landing }}
          KOB_PAGES_INDEXER_URL: ${{ matrix.indexer }}
          KOB_PAGES_EXTRA_INDEXER_URLS: ${{ matrix.extra }}
          KOB_PAGES_NODE_URL: ${{ matrix.node }}
          KOB_PAGES_EXPLORER_URL: ${{ matrix.explorer }}
          KOB_PAGES_TOKEN_NAMES_URL: ${{ matrix.names }}
          # the internal mainnet app also gets robots.txt (Disallow: /) and X-Robots-Tag: noindex in its _headers
          KOB_PAGES_INTERNAL: ${{ matrix.internal }}
        run: node scripts/pages-config.mjs --dist dist | tee "$RUNNER_TEMP/pages-config.txt"
      - name: sha256 of every file deployed (the logic of scripts/release-hashes.sh)
        working-directory: .
        run: find web/dist -type f | LC_ALL=C sort | xargs sha256sum > "$RUNNER_TEMP/deployed.sha256"
      # a first run creates the Direct Upload project (docs/ops/web-hosting.md 1); on later runs it exists and this step's failure is ignored
      - name: Create the Pages project if it does not exist yet
        continue-on-error: true
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.152.0"
          packageManager: npm
          command: pages project create ${{ matrix.project }} --production-branch=${{ needs.config.outputs.branch }}
      - name: Upload web/dist to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.152.0"
          packageManager: npm
          command: pages deploy web/dist --project-name=${{ matrix.project }} --branch=${{ matrix.branch }} --commit-hash=${{ github.sha }} --commit-dirty=true
      - name: Summary (deployment URL, config.json, sha256 of every deployed file)
        working-directory: .
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          PAGES_ENV: ${{ steps.deploy.outputs.pages-environment }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.pages-deployment-id }}
        run: |
          {
            echo "## Cloudflare Pages deployment: ${{ matrix.site }} (${{ matrix.network }}${{ matrix.landing != '' && ', landing-only' || '' }}, project ${{ matrix.project }})"
            echo
            echo "- deployment: $URL"
            [ -z "$ALIAS" ] || echo "- alias: $ALIAS"
            echo "- environment: ${PAGES_ENV:-unknown}, deployment id: ${DEPLOYMENT_ID:-unknown}"
            echo "- commit: \`$GITHUB_SHA\`"
            echo
            echo "### config.json"
            echo
            echo '```'
            cat "$RUNNER_TEMP/pages-config.txt"
            echo '```'
            echo
            echo "### Deployed files (sha256)"
            echo
            echo '```'
            cat "$RUNNER_TEMP/deployed.sha256"
            echo '```'
            echo
            echo "<details><summary>scripts/release-hashes.sh (the bundle as built, before config.json)</summary>"
            echo
            cat "$RUNNER_TEMP/release-hashes.md"
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: The deployment is the production one (KOB_PAGES_BRANCH = the project's production branch); the internal app is a preview
        env:
          PAGES_ENV: ${{ steps.deploy.outputs.pages-environment }}
          INTERNAL: ${{ matrix.internal }}
        run: |
          if [ -n "$INTERNAL" ]; then
            # the internal mainnet app must never become the production deployment (it would be the public site)
            if [ "$PAGES_ENV" != preview ]; then
              echo "::error::the internal app became a ${PAGES_ENV:-unknown} deployment, not a preview: it must be a preview on the branch \`internal\`, which is not the project's production branch (docs/ops/web-hosting.md 4c)"
              exit 1
            fi
          elif [ "$PAGES_ENV" != production ]; then
            echo "::error::the upload became a ${PAGES_ENV:-unknown} deployment, not production: set KOB_PAGES_BRANCH to the production branch of the Pages project (docs/ops/web-hosting.md)"
            exit 1
          fi
      # the internal mainnet app: an unauthenticated request must meet Cloudflare Access (the project's access policy for previews), on the deployment URL and on the
      # branch alias, never the app; the job fails (and says to delete the deployment) when it is served openly
      - name: Post-deploy check of the internal app (behind Cloudflare Access, not served openly)
        if: matrix.internal != ''
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          urls=()
          for u in "$URL" "$ALIAS"; do
            case "$u" in https://*) urls+=("$u") ;; esac
          done
          if [ ${#urls[@]} -lt 2 ]; then
            echo "::error::wrangler gave no https deployment and alias URL for the internal app (deployment \`$URL\`, alias \`$ALIAS\`): the protection cannot be checked"; exit 1
          fi
          set +e
          node scripts/check-pages.mjs --protected "${urls[@]}" > "$RUNNER_TEMP/check.txt" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/check.txt"
          { echo; echo "### Protection check (internal app)"; echo; echo '```'; cat "$RUNNER_TEMP/check.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Post-deploy check (headers of public/_headers, every file byte for byte)
        if: matrix.internal == ''
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          LANDING: ${{ matrix.landing }}
        run: |
          case "$URL" in https://*) ;; *) echo "::error::no https deployment URL from wrangler: \`$URL\`"; exit 1 ;; esac
          # the landing-only site has no signer page to check
          flags=()
          if [ -n "$LANDING" ]; then flags+=(--landing-only); fi
          set +e
          node scripts/check-pages.mjs "$URL" --dist dist "${flags[@]}" > "$RUNNER_TEMP/check.txt" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/check.txt"
          { echo; echo "### Post-deploy check"; echo; echo '```'; cat "$RUNNER_TEMP/check.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      # the custom domain: the host of the public URL, attached to the project (and its DNS record) when that is not done yet; what the
      # token cannot do is printed as dashboard steps (docs/ops/web-hosting.md, section 5)
      - name: Custom domain of the site (the host of the public URL)
        if: matrix.public != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ matrix.project }}
          PUBLIC_URL: ${{ matrix.public }}
        run: node scripts/pages-domain.mjs --project "$PROJECT" --public-url "$PUBLIC_URL" | tee -a "$GITHUB_STEP_SUMMARY"
