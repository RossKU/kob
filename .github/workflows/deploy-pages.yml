name: deploy-pages

# The public web app on Cloudflare Pages (docs/ops/web-hosting.md). On a push to master that changes the app or its inputs, and on
# workflow_dispatch: the web app is built and tested as the web job of ci.yml does (the e2e suite is that run's: the deploy waits for it), config.json is written from the repository
# variables KOB_PAGES_* (web/scripts/pages-config.mjs; on testnet-10 also the token-program list as registry/tokens.json), web/dist
# is uploaded to the Pages project KOB_PAGES_PROJECT (a Direct Upload project: the build needs Rust and wasm, so Cloudflare does not
# build it) and the live deployment is checked by the job verify, which holds no secret: the headers of public/_headers (CSP with frame-ancestors 'none', X-Frame-Options DENY,
# the signer page's own policy) and every file byte for byte (web/scripts/check-pages.mjs); any difference fails the job. The job
# summary lists the deployment URL and the sha256 of every deployed file.
#
# One public site: the app, project KOB_PAGES_PROJECT, variables KOB_PAGES_*. Today it is built for testnet-10 and served at both kob.kaspa.ag and
# https://kob-tn10.kaspa.ag (the host of KOB_PAGES_PUBLIC_URL; kob.kaspa.ag is a second custom domain of the same project and deployment, attached by hand).
# There is no separate mainnet site and no landing-only page. The mainnet launch is a change of this same site: the variables KOB_PAGES_NETWORK=mainnet,
# KOB_PAGES_NETWORKS and KOB_PAGES_HOST_NETWORKS (kob.kaspa.ag opens on mainnet, kob-tn10.kaspa.ag on testnet-10) and the header network switch
# (KOB_PAGES_NETWORK_SWITCH=1; unset, the site is pinned), docs/ops/web-hosting.md 4b and 4d. An optional second site, the INTERNAL mainnet app
# (KOB_PAGES_MAINNET_INTERNAL=1, which also needs KOB_PAGES_MAINNET_PROJECT and KOB_PAGES_MAINNET_INDEXER_URL), is the full mainnet app uploaded to its own
# Pages project as a preview deployment on the branch `internal`, for the founder's own testing: the variable says the project's previews are behind
# Cloudflare Access (docs/ops/web-hosting.md, 4c), and the job fails when an unauthenticated request to it is not sent to Access (it also sends X-Robots-Tag:
# noindex and a robots.txt that disallows everything). The site's custom domain is the host of its public URL (KOB_PAGES_PUBLIC_URL): after the deployment web/scripts/pages-domain.mjs adds it to the
# project through the Pages API when it is not attached yet, and says exactly what is left to do in the dashboard when it cannot do it
# (the DNS CNAME, a domain that is still attached to another project).
#
# One site can serve both networks: KOB_PAGES_NETWORKS (KOB_PAGES_MAINNET_NETWORKS for the internal mainnet app) gives config.json the servers of the other network, and
# KOB_PAGES_HOST_NETWORKS (KOB_PAGES_MAINNET_HOST_NETWORKS) the default network of each host name (docs/ops/web-hosting.md, "One deployment for both
# networks"). Both are optional; unset, config.json is what it was without them.
#
# Without the variables KOB_PAGES_PROJECT and KOB_PAGES_INDEXER_URL (a fork, or before the setup) nothing is built: the job config
# says what is missing and the deploy job is skipped. A variable that is set but invalid fails the job config. The secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are ENVIRONMENT secrets of `production` (docs/ops/web-hosting.md, section 3): only job
# deploy reads them, and it fails when they are missing. A repository secret is given to every workflow of every branch, so a copy of
# the token at repository level would bypass the gate below: job secret-scope, which runs in no environment, sees only such a copy,
# and fails a mainnet run while one exists.
#
# The variables are not secrets: config.json is public. Never put an API key into a URL variable (the script refuses query strings).
#
# Gate: the signer page this deploys is where users type private keys, so production is deployed only from refs/heads/master (a run
# of any other ref, e.g. a workflow_dispatch from a branch, fails in the first step of job config), and job deploy runs in the GitHub
# environment `production`: Settings > Environments > production can require a reviewer (and limit the deployment branches to master)
# before the job starts (docs/ops/web-hosting.md, section 4a). When the public site is mainnet (KOB_PAGES_NETWORK=mainnet), job config
# fails unless it reads a required reviewer and a deployment-branch rule on `production`, or, when the API refuses the read (HTTP 403
# only; a missing environment fails), unless the variable KOB_PAGES_PRODUCTION_GATE_CONFIRMED=1 says they are set. KOB_PAGES_NETWORK
# must be exactly `testnet-10`, `mainnet` or unset (no white space: the build trims it, the gate must not see another value). A
# testnet-10 site is not checked.
#
# Jobs: config (no secret) checks the variables and the gate; secret-scope (no environment) only asks whether a repository-level
# copy of the Cloudflare token exists; build (no secret, no environment) builds and tests the bundle, writes config.json and hands web/dist and its hashes on as
# artifacts; deploy (environment production, the Cloudflare secrets) only uploads that dist, with the wrangler of
# scripts/deploy/package-lock.json installed with --ignore-scripts; attest (no secret) records the build provenance of that dist;
# verify (no secret) checks the live deployment against the hashes.

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - "crates/kob-wasm/**"
      - "crates/kob-protocol/**"
      - "vendor/**"
      - "contracts/**"
      - "registry/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/build-wasm.sh"
      - "scripts/build-deploy.sh"
      - "scripts/release-hashes.sh"
      - "scripts/lib/**"
      - "scripts/deploy/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read # the step "ci passed for this commit" reads the ci.yml run of the same sha

# one deploy at a time; a newer push cancels the older run (the latest commit wins)
concurrency:
  group: deploy-pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  config:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      matrix: ${{ steps.gate.outputs.matrix }}
      branch: ${{ steps.gate.outputs.branch }}
      network: ${{ steps.gate.outputs.network }}
    steps:
      - name: Production deploys only from master
        if: github.ref != 'refs/heads/master'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error title=deploy-pages::production is deployed only from refs/heads/master, not from $REF (docs/ops/web-hosting.md, section 4a)"
          exit 1
      # the variables alone say whether a deploy is configured: this job runs in no environment, so it cannot see the environment's
      # secrets (and must not ask for a repository copy of them: job secret-scope does that, and only that)
      - name: Pages variables (missing = the deploy is skipped)
        id: gate
        env:
          PROJECT: ${{ vars.KOB_PAGES_PROJECT }}
          INDEXER: ${{ vars.KOB_PAGES_INDEXER_URL }}
          BRANCH: ${{ vars.KOB_PAGES_BRANCH }}
          NETWORK: ${{ vars.KOB_PAGES_NETWORK }}
          EXTRA: ${{ vars.KOB_PAGES_EXTRA_INDEXER_URLS }}
          NODE: ${{ vars.KOB_PAGES_NODE_URL }}
          EXPLORER: ${{ vars.KOB_PAGES_EXPLORER_URL }}
          NAMES: ${{ vars.KOB_PAGES_TOKEN_NAMES_URL }}
          PUBLIC: ${{ vars.KOB_PAGES_PUBLIC_URL }}
          MAIN_PROJECT: ${{ vars.KOB_PAGES_MAINNET_PROJECT }}
          MAIN_INDEXER: ${{ vars.KOB_PAGES_MAINNET_INDEXER_URL }}
          MAIN_EXTRA: ${{ vars.KOB_PAGES_MAINNET_EXTRA_INDEXER_URLS }}
          MAIN_NODE: ${{ vars.KOB_PAGES_MAINNET_NODE_URL }}
          MAIN_EXPLORER: ${{ vars.KOB_PAGES_MAINNET_EXPLORER_URL }}
          MAIN_NAMES: ${{ vars.KOB_PAGES_MAINNET_TOKEN_NAMES_URL }}
          MAIN_INTERNAL: ${{ vars.KOB_PAGES_MAINNET_INTERNAL }}
          NETWORKS: ${{ vars.KOB_PAGES_NETWORKS }}
          HOSTS: ${{ vars.KOB_PAGES_HOST_NETWORKS }}
          MAIN_NETWORKS: ${{ vars.KOB_PAGES_MAINNET_NETWORKS }}
          MAIN_HOSTS: ${{ vars.KOB_PAGES_MAINNET_HOST_NETWORKS }}
          SWITCH: ${{ vars.KOB_PAGES_NETWORK_SWITCH }}
        run: |
          missing=()
          [ -n "$PROJECT" ] || missing+=("variable KOB_PAGES_PROJECT")
          [ -n "$INDEXER" ] || missing+=("variable KOB_PAGES_INDEXER_URL")
          if [ ${#missing[@]} -gt 0 ]; then
            {
              echo "## Cloudflare Pages deploy skipped"
              echo
              echo "Not configured in this repository (Settings > Secrets and variables > Actions > Variables):"
              echo
              for m in "${missing[@]}"; do echo "- $m"; done
              echo
              echo "Nothing was built or deployed. Setup: docs/ops/web-hosting.md."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=deploy-pages skipped::not configured: ${missing[*]} (docs/ops/web-hosting.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # the network exactly as the gate below compares it: pages-config.mjs and head-meta.mjs trim it, so `mainnet ` would build
          # mainnet while a looser comparison here skipped the production gate
          NETWORK=${NETWORK:-testnet-10}
          case "$NETWORK" in
            testnet-10 | mainnet) ;;
            *) echo "::error::KOB_PAGES_NETWORK must be exactly testnet-10 or mainnet (or unset), with no white space, not \`$NETWORK\`"; exit 1 ;;
          esac
          # Pages project names: lower-case letters, digits and dashes; branch names: git-safe characters only
          if ! [[ "$PROJECT" =~ ^[a-z0-9][a-z0-9-]{0,57}$ ]]; then
            echo "::error::KOB_PAGES_PROJECT \`$PROJECT\` is not a Pages project name (a-z, 0-9 and -, at most 58 characters)"; exit 1
          fi
          BRANCH=${BRANCH:-main}
          if ! [[ "$BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$ ]]; then
            echo "::error::KOB_PAGES_BRANCH \`$BRANCH\` is not a branch name"; exit 1
          fi
          # the header network switch of the public site: 1 / true = on; unset or 0 = pinned (config.json lockNetwork). A typo must not pin the site silently
          if [ -n "$SWITCH" ] && ! [[ "$SWITCH" =~ ^(0|1|[Tt][Rr][Uu][Ee])$ ]]; then
            echo "::error::KOB_PAGES_NETWORK_SWITCH must be 1, true, 0 or unset, not \`$SWITCH\`"; exit 1
          fi
          # the mainnet project exists only for the internal mainnet app (there is no public mainnet site): an indexer without a project is a mistake, and a project
          # without KOB_PAGES_MAINNET_INTERNAL=1 would build nothing
          if [ -z "$MAIN_PROJECT" ] && [ -n "$MAIN_INDEXER" ]; then
            echo "::error::KOB_PAGES_MAINNET_INDEXER_URL is set without KOB_PAGES_MAINNET_PROJECT"; exit 1
          fi
          if [ -n "$MAIN_PROJECT" ] && [ "$MAIN_INTERNAL" != 1 ]; then
            echo "::error::KOB_PAGES_MAINNET_PROJECT is only the project of the internal mainnet app: set KOB_PAGES_MAINNET_INTERNAL=1 (after enabling the access policy) or unset the project"; exit 1
          fi
          if [ -n "$MAIN_PROJECT" ]; then
            if ! [[ "$MAIN_PROJECT" =~ ^[a-z0-9][a-z0-9-]{0,57}$ ]]; then
              echo "::error::KOB_PAGES_MAINNET_PROJECT \`$MAIN_PROJECT\` is not a Pages project name (a-z, 0-9 and -, at most 58 characters)"; exit 1
            fi
            if [ "$MAIN_PROJECT" = "$PROJECT" ]; then
              echo "::error::KOB_PAGES_MAINNET_PROJECT must not be the testnet-10 project"; exit 1
            fi
          fi
          # the internal mainnet app (KOB_PAGES_MAINNET_INTERNAL=1): the full mainnet app as a PREVIEW deployment of the mainnet project on the fixed branch
          # `internal`, for the founder's own testing. The variable says the project's previews are behind Cloudflare Access (docs/ops/web-hosting.md, 4c); it
          # needs the mainnet project and the mainnet indexer, and the production branch must not be `internal` (that upload would be the public site)
          if [ -n "$MAIN_INTERNAL" ] && [ "$MAIN_INTERNAL" != 1 ]; then
            echo "::error::KOB_PAGES_MAINNET_INTERNAL must be 1 (previews are protected by Cloudflare Access) or unset, not \`$MAIN_INTERNAL\`"; exit 1
          fi
          if [ "$MAIN_INTERNAL" = 1 ]; then
            if [ -z "$MAIN_PROJECT" ] || [ -z "$MAIN_INDEXER" ]; then
              echo "::error::KOB_PAGES_MAINNET_INTERNAL=1 needs KOB_PAGES_MAINNET_PROJECT and KOB_PAGES_MAINNET_INDEXER_URL (the internal app is the full mainnet app)"; exit 1
            fi
            if [ "$BRANCH" = internal ]; then
              echo "::error::KOB_PAGES_BRANCH must not be \`internal\`: that branch is the protected preview of the internal mainnet app"; exit 1
            fi
          fi
          # one matrix entry per site; every value is a repository variable (not a secret). `branch` is the Pages branch the site is uploaded to
          # (production: KOB_PAGES_BRANCH; the internal app: `internal`, a preview) and `internal` marks that preview. `networks` and `hosts` are the JSON
          # of config.json `networks` / `hostNetworks` (empty = none); `netswitch` is KOB_PAGES_NETWORK_SWITCH (the internal app stays pinned)
          matrix=$(jq -nc \
            --arg p "$PROJECT" --arg n "$NETWORK" --arg i "$INDEXER" --arg e "$EXTRA" --arg nd "$NODE" --arg ex "$EXPLORER" --arg nm "$NAMES" --arg u "$PUBLIC" --arg br "$BRANCH" \
            --arg mp "$MAIN_PROJECT" --arg mi "$MAIN_INDEXER" --arg me "$MAIN_EXTRA" --arg mnd "$MAIN_NODE" --arg mex "$MAIN_EXPLORER" --arg mnm "$MAIN_NAMES" --arg mint "$MAIN_INTERNAL" \
            --arg nw "$NETWORKS" --arg hn "$HOSTS" --arg mnw "$MAIN_NETWORKS" --arg mhn "$MAIN_HOSTS" --arg sw "$SWITCH" \
            '{include: ([{site: "testnet", project: $p, network: $n, branch: $br, internal: "", indexer: $i, extra: $e, networks: $nw, hosts: $hn, netswitch: $sw, node: $nd, explorer: $ex, names: $nm, public: $u}]
              + (if $mp != "" and $mint == "1" then [{site: "mainnet-internal", project: $mp, network: "mainnet", branch: "internal", internal: "1", indexer: $mi, extra: $me, networks: $mnw, hosts: $mhn, netswitch: "", node: $mnd, explorer: $mex, names: $mnm, public: ""}] else [] end))}')
          { echo "ready=true"; echo "branch=$BRANCH"; echo "network=$NETWORK"; echo "matrix=$matrix"; } >> "$GITHUB_OUTPUT"
      # The mainnet signer page must not deploy without a human approval. The workflow cannot set that (it is a repository setting), so it
      # reads it: a required reviewer on `production` and a deployment-branch rule (master only, or protected branches with master
      # protected). A read that shows either missing fails, whatever the variable says. A read the API refuses (HTTP 403) fails unless
      # the founder confirms the settings with KOB_PAGES_PRODUCTION_GATE_CONFIRMED=1 (docs/ops/web-hosting.md, section 4a); any other
      # failure fails, a 404 above all: a missing environment would be created by job deploy with no protection. testnet-10 is not checked.
      - name: The production environment gates a mainnet deploy (a required reviewer and a branch rule)
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # the value the previous step checked (exactly testnet-10 or mainnet), never the raw variable
          NETWORK: ${{ steps.gate.outputs.network }}
          CONFIRMED: ${{ vars.KOB_PAGES_PRODUCTION_GATE_CONFIRMED }}
        run: |
          case "$NETWORK" in
            mainnet) ;;
            testnet-10) echo "public site on testnet-10: the production gate is not checked"; exit 0 ;;
            *) echo "::error::no checked network (\`$NETWORK\`)"; exit 1 ;;
          esac
          if [ -n "$CONFIRMED" ] && [ "$CONFIRMED" != 1 ]; then
            echo "::error::KOB_PAGES_PRODUCTION_GATE_CONFIRMED must be 1 or unset, not \`$CONFIRMED\`"; exit 1
          fi
          fail() { echo "::error title=deploy-pages gate::$1 (docs/ops/web-hosting.md, section 4a)"; echo "- **gate:** $1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          if env_json=$(gh api "repos/$GITHUB_REPOSITORY/environments/production" 2> "$RUNNER_TEMP/gate.err"); then
            reviewers=$(jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length' <<< "$env_json")
            [ "$reviewers" -gt 0 ] || fail "the production environment has no required reviewer: a mainnet deploy would run with no approval"
            policy=$(jq -c '.deployment_branch_policy' <<< "$env_json")
            if [ "$policy" = null ]; then
              fail "the production environment has no deployment-branch rule (every branch may deploy)"
            elif [ "$(jq -r '.custom_branch_policies' <<< "$policy")" = true ]; then
              names=$(gh api "repos/$GITHUB_REPOSITORY/environments/production/deployment-branch-policies" \
                --jq '[.branch_policies[] | "\(.type // "branch"):\(.name)"] | sort | join(",")') || fail "the deployment-branch rules of production could not be read"
              [ "$names" = "branch:master" ] || fail "the deployment-branch rule of production must be the branch master only, not \`$names\`"
            else
              protected=$(gh api "repos/$GITHUB_REPOSITORY/branches/master" --jq .protected) || fail "whether master is protected could not be read"
              [ "$protected" = true ] || fail "production deploys from protected branches, but master is not protected"
            fi
            if [ "$(jq -r '.can_admins_bypass' <<< "$env_json")" = true ]; then
              echo "::warning title=deploy-pages gate::administrators may bypass the production reviewer (Settings > Environments > production: untick 'Allow administrators to bypass')"
            fi
            echo "production gate: $reviewers required reviewer(s), deployment-branch rule $policy"
          elif ! grep -q '(HTTP 403)' "$RUNNER_TEMP/gate.err"; then
            # 404: no environment `production` (job deploy would create it unprotected); 5xx, a rate limit: nothing is known
            fail "the production environment could not be read ($(head -c 200 "$RUNNER_TEMP/gate.err")): only a refused read (HTTP 403) may rely on KOB_PAGES_PRODUCTION_GATE_CONFIRMED; create the environment with its reviewer and branch rule, or re-run"
          elif [ "$CONFIRMED" = 1 ]; then
            echo "::notice title=deploy-pages gate::the API refused the read of the production settings ($(head -c 200 "$RUNNER_TEMP/gate.err")); KOB_PAGES_PRODUCTION_GATE_CONFIRMED=1 says the reviewer and the branch rule are set"
          else
            fail "the API refused the read of the production environment ($(head -c 200 "$RUNNER_TEMP/gate.err")): set the required reviewer and the branch rule, then the variable KOB_PAGES_PRODUCTION_GATE_CONFIRMED=1"
          fi
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.1" # exact and the same in every workflow (docs/ops/release.md 6)
      - name: The variables make a valid public config.json for every site (before anything is built)
        if: steps.gate.outputs.ready == 'true'
        env:
          MATRIX: ${{ steps.gate.outputs.matrix }}
          # an optional incident banner (docs/ops/web-hosting.md): plain text, shown on every page, blocks nothing
          KOB_PAGES_INCIDENT_MESSAGE: ${{ vars.KOB_PAGES_INCIDENT_MESSAGE }}
          KOB_PAGES_INCIDENT_SINCE: ${{ vars.KOB_PAGES_INCIDENT_SINCE }}
          KOB_PAGES_INCIDENT_URL: ${{ vars.KOB_PAGES_INCIDENT_URL }}
        run: |
          rc=0
          while IFS= read -r site; do
            echo "== $(jq -r .site <<< "$site")"
            KOB_PAGES_NETWORK=$(jq -r .network <<< "$site") KOB_PAGES_INDEXER_URL=$(jq -r .indexer <<< "$site") \
            KOB_PAGES_EXTRA_INDEXER_URLS=$(jq -r .extra <<< "$site") KOB_PAGES_NODE_URL=$(jq -r .node <<< "$site") \
            KOB_PAGES_EXPLORER_URL=$(jq -r .explorer <<< "$site") KOB_PAGES_TOKEN_NAMES_URL=$(jq -r .names <<< "$site") \
            KOB_PAGES_NETWORKS=$(jq -r .networks <<< "$site") KOB_PAGES_HOST_NETWORKS=$(jq -r .hosts <<< "$site") \
            KOB_PAGES_NETWORK_SWITCH=$(jq -r .netswitch <<< "$site") \
              node web/scripts/pages-config.mjs --check || rc=1
          done < <(jq -c '.include[]' <<< "$MATRIX")
          exit "$rc"

  # The Cloudflare secrets belong to the environment `production`, whose reviewer and branch rule decide who gets them. A job with no
  # environment sees a secret only when a repository-level copy exists, and any workflow file on any branch can read that copy and
  # upload to the site without the gate. This job asks only whether such a copy exists (the value never reaches the runner): on a
  # mainnet site it fails the run, on testnet-10 it warns (docs/ops/web-hosting.md, section 3).
  secret-scope:
    needs: config
    if: needs.config.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    defaults:
      run:
        shell: bash
    steps:
      - name: No repository-level copy of the Cloudflare secrets (they are secrets of the environment production only)
        env:
          REPO_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          REPO_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          NETWORK: ${{ needs.config.outputs.network }}
          # the internal mainnet app is uploaded with the same token
          INTERNAL: ${{ contains(needs.config.outputs.matrix, '"mainnet-internal"') }}
        run: |
          found=()
          [ "$REPO_TOKEN" != true ] || found+=(CLOUDFLARE_API_TOKEN)
          [ "$REPO_ACCOUNT" != true ] || found+=(CLOUDFLARE_ACCOUNT_ID)
          if [ ${#found[@]} -eq 0 ]; then echo "no repository-level Cloudflare secret"; exit 0; fi
          msg="repository-level secret(s) ${found[*]}: every workflow on every branch can read them, past the production reviewer. Delete the repository copies after adding them as secrets of the environment production (Settings > Secrets and variables > Actions > Repository secrets; docs/ops/web-hosting.md, section 3)"
          echo "- **secret scope:** $msg" >> "$GITHUB_STEP_SUMMARY"
          if [ "$NETWORK" != mainnet ] && [ "$INTERNAL" != true ]; then
            echo "::warning title=deploy-pages secret scope::$msg. A mainnet run fails while they exist."; exit 0
          fi
          echo "::error title=deploy-pages secret scope::$msg"
          exit 1

  # The bundle, built and tested in a job that holds no secret and runs in no environment: nothing that runs here (npm ci, a build
  # script, vite, the tests) ever shares a runner with the Cloudflare token. It hands web/dist (config.json included) and its hashes
  # to the deploy and verify jobs as artifacts, which a later job cannot change.
  build:
    needs: config
    if: needs.config.outputs.ready == 'true' && github.ref == 'refs/heads/master'
    name: build (${{ matrix.site }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # the step "ci passed for this commit" reads the ci.yml run of the same sha
    defaults:
      run:
        shell: bash # -eo pipefail: a failing command before a pipe fails the step
        working-directory: web
    steps:
      # build and test: the steps of the web job of ci.yml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master as of 2026-10-01 (the action has no release tags)
        with:
          toolchain: "1.94.0"
          targets: wasm32-unknown-unknown
      # no rust cache here: the deployed bundle (the signer page among it) is built from source, never from a restored target/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.1" # exact and the same in every workflow (docs/ops/release.md 6)
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run fetch-sdk
      - name: kob-wasm bindings (installs wasm-bindgen-cli 0.2.100 under target/tools)
        working-directory: .
        run: bash scripts/build-wasm.sh --install-bindgen --web --slim
      - run: npm run build:wasm -- --copy
      - run: npm run typecheck
      - run: npm test
      # the app's e2e suite is not run again here: ci.yml runs it on the same commit (sharded), and the step "ci passed for this commit" below waits for
      # that run before anything is handed to the deploy job

      # the release bundle (vite build plus dist/registry/tokens.json, docs/ops/release.md 4); the link-preview head (web/head-meta.mjs) takes the
      # network and, when set, the public origin the deployment is served from (og:url, og:image)
      - run: npm run build:release
        env:
          KOB_NETWORK: ${{ matrix.network }}
          KOB_PUBLIC_URL: ${{ matrix.public }}
      - name: Release hashes (the deployment record reproduces, the bundle embeds and ships the registry the mainnet record pins)
        working-directory: .
        env:
          # a shallow checkout: the lock-history check of scripts/lib/deploy.mjs runs in job contracts of ci.yml (whole history),
          # whose pass on this commit the step below waits for
          KOB_DEPLOY_NO_HISTORY: "1"
        run: |
          bash scripts/release-hashes.sh > "$RUNNER_TEMP/release-hashes.md"
          cat "$RUNNER_TEMP/release-hashes.md"
      - name: ci passed for this commit (the master push run of ci.yml on the same sha, which runs every job and whose ci-ok covers the e2e suite; a failed or cancelled run fails the deploy)
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 240); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=master&event=push&per_page=1" --jq '.workflow_runs[0] | "\(.status) \(.conclusion) \(.head_sha)"')
            echo "ci: $run"
            case "$run" in
              "completed success $GITHUB_SHA") exit 0 ;;
              completed*) echo "::error::ci did not pass for $GITHUB_SHA ($run)"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::ci did not finish within two hours"; exit 1

      # the deployment: config.json from the repository variables
      - name: config.json from the repository variables
        env:
          KOB_PAGES_NETWORK: ${{ matrix.network }}
          KOB_PAGES_INDEXER_URL: ${{ matrix.indexer }}
          KOB_PAGES_EXTRA_INDEXER_URLS: ${{ matrix.extra }}
          KOB_PAGES_NODE_URL: ${{ matrix.node }}
          KOB_PAGES_EXPLORER_URL: ${{ matrix.explorer }}
          KOB_PAGES_TOKEN_NAMES_URL: ${{ matrix.names }}
          KOB_PAGES_NETWORKS: ${{ matrix.networks }}
          KOB_PAGES_HOST_NETWORKS: ${{ matrix.hosts }}
          # 1 / true: the header network switch (no lockNetwork); unset: the site is pinned to its network
          KOB_PAGES_NETWORK_SWITCH: ${{ matrix.netswitch }}
          # the internal mainnet app also gets robots.txt (Disallow: /) and X-Robots-Tag: noindex in its _headers
          KOB_PAGES_INTERNAL: ${{ matrix.internal }}
          # an optional incident banner (docs/ops/web-hosting.md): plain text, shown on every page, blocks nothing
          KOB_PAGES_INCIDENT_MESSAGE: ${{ vars.KOB_PAGES_INCIDENT_MESSAGE }}
          KOB_PAGES_INCIDENT_SINCE: ${{ vars.KOB_PAGES_INCIDENT_SINCE }}
          KOB_PAGES_INCIDENT_URL: ${{ vars.KOB_PAGES_INCIDENT_URL }}
        run: node scripts/pages-config.mjs --dist dist | tee "$RUNNER_TEMP/pages-config.txt"
      - name: sha256 of every file deployed (the logic of scripts/release-hashes.sh)
        working-directory: .
        run: find web/dist -type f | LC_ALL=C sort | xargs sha256sum > "$RUNNER_TEMP/deployed.sha256"
      # the hashes go to the deploy and verify jobs, the dist to the deploy job; an artifact name is written once per run, so no later job
      # can replace either
      - name: The hashes, for the deploy and verify jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployed-sha256-${{ matrix.site }}
          path: ${{ runner.temp }}/deployed.sha256
          if-no-files-found: error
          retention-days: 7
      - name: The config.json and release-hashes output, for the deploy job's summary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-notes-${{ matrix.site }}
          path: |
            ${{ runner.temp }}/pages-config.txt
            ${{ runner.temp }}/release-hashes.md
          if-no-files-found: error
          retention-days: 7
      - name: web/dist, for the deploy job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist-${{ matrix.site }}
          path: web/dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  # Build provenance of every file of the dist job build made (keyless Sigstore, as release.yml does for the archives): it binds each
  # file's sha256 to this workflow, run and commit, so a deployed file can be checked with
  # `gh attestation verify <file> --repo RossKU/kob --signer-workflow RossKU/kob/.github/workflows/deploy-pages.yml`. It runs no
  # code of the app or its dependencies and holds no secret; it proves where the files were built, not that the build was honest.
  attest:
    needs: [config, build]
    if: needs.config.outputs.ready == 'true' && github.ref == 'refs/heads/master'
    name: attest (${{ matrix.site }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist-${{ matrix.site }}
          path: web/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deployed-sha256-${{ matrix.site }}
          path: ${{ runner.temp }}/handover
      - name: The dist is the one job build hashed
        shell: bash
        run: sha256sum --check --strict --quiet "$RUNNER_TEMP/handover/deployed.sha256"
      - name: Build provenance of every file of web/dist
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: web/dist/**

  # The upload, and the only job that sees the Cloudflare token. It builds nothing and runs no code of the app's dependencies: it takes the
  # dist of job build, checks it against the hashes, and runs wrangler from scripts/deploy/package-lock.json (an exact version and
  # integrity pins for its whole tree, installed with --ignore-scripts). Every value reaches a command through env:, never inline.
  deploy:
    needs: [config, secret-scope, build]
    if: needs.config.outputs.ready == 'true' && github.ref == 'refs/heads/master'
    name: deploy (${{ matrix.site }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.matrix) }}
    # a required reviewer of the environment approves here, before the job (and the Cloudflare secrets) start
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash # -eo pipefail: a failing command before a pipe fails the step
    env:
      WRANGLER: ${{ github.workspace }}/scripts/deploy/node_modules/.bin/wrangler
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.1" # exact and the same in every workflow (docs/ops/release.md 6)
      - name: wrangler from scripts/deploy/package-lock.json (no install scripts)
        working-directory: scripts/deploy
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          "$WRANGLER" --version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist-${{ matrix.site }}
          path: web/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deployed-sha256-${{ matrix.site }}
          path: ${{ runner.temp }}/handover
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-notes-${{ matrix.site }}
          path: ${{ runner.temp }}/handover
      - name: The dist to upload is the one job build hashed (every file, nothing more)
        run: |
          sha256sum --check --strict --quiet "$RUNNER_TEMP/handover/deployed.sha256"
          files=$(find web/dist -type f | wc -l)
          hashed=$(wc -l < "$RUNNER_TEMP/handover/deployed.sha256")
          [ "$files" = "$hashed" ] || { echo "::error::web/dist has $files files, job build hashed $hashed"; exit 1; }
      - name: The Cloudflare secrets of the environment production are set
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" != true ] || [ "$HAS_ACCOUNT" != true ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be secrets of the environment production (Settings > Environments > production > Environment secrets; docs/ops/web-hosting.md, section 3)"
            exit 1
          fi
      # a first run creates the Direct Upload project (docs/ops/web-hosting.md 1); on later runs it exists and this step's failure is ignored
      - name: Create the Pages project if it does not exist yet
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ matrix.project }}
          PRODUCTION_BRANCH: ${{ needs.config.outputs.branch }}
        run: |
          "$WRANGLER" pages project create "$PROJECT" --production-branch="$PRODUCTION_BRANCH"
      # wrangler writes what the deployment became (url, alias, environment, id) to WRANGLER_OUTPUT_FILE_PATH, one JSON object per line
      - name: Upload web/dist to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ matrix.project }}
          PAGES_BRANCH: ${{ matrix.branch }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          "$WRANGLER" pages deploy web/dist --project-name="$PROJECT" --branch="$PAGES_BRANCH" --commit-hash="$GITHUB_SHA" --commit-dirty=true
          d=$(jq -cs 'map(select(.type == "pages-deploy-detailed")) | last // empty' "$WRANGLER_OUTPUT_FILE_PATH")
          [ -n "$d" ] || { echo "::error::wrangler reported no pages deployment"; exit 1; }
          {
            echo "deployment-url=$(jq -r '.url // ""' <<< "$d")"
            echo "pages-deployment-alias-url=$(jq -r '.alias // ""' <<< "$d")"
            echo "pages-environment=$(jq -r '.environment // ""' <<< "$d")"
            echo "pages-deployment-id=$(jq -r '.deployment_id // ""' <<< "$d")"
          } >> "$GITHUB_OUTPUT"
      - name: Summary (deployment URL, config.json, sha256 of every deployed file)
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          PAGES_ENV: ${{ steps.deploy.outputs.pages-environment }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.pages-deployment-id }}
          SITE: ${{ matrix.site }}
          NETWORK: ${{ matrix.network }}
          PROJECT: ${{ matrix.project }}
        run: |
          {
            echo "## Cloudflare Pages deployment: $SITE ($NETWORK, project $PROJECT)"
            echo
            echo "- deployment: $URL"
            [ -z "$ALIAS" ] || echo "- alias: $ALIAS"
            echo "- environment: ${PAGES_ENV:-unknown}, deployment id: ${DEPLOYMENT_ID:-unknown}"
            echo "- commit: \`$GITHUB_SHA\`"
            echo
            echo "### config.json"
            echo
            echo '```'
            cat "$RUNNER_TEMP/handover/pages-config.txt"
            echo '```'
            echo
            echo "### Deployed files (sha256)"
            echo
            echo '```'
            cat "$RUNNER_TEMP/handover/deployed.sha256"
            echo '```'
            echo
            echo "<details><summary>scripts/release-hashes.sh (the bundle as built, before config.json)</summary>"
            echo
            cat "$RUNNER_TEMP/handover/release-hashes.md"
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: The deployment is the production one (KOB_PAGES_BRANCH = the project's production branch); the internal app is a preview
        env:
          PAGES_ENV: ${{ steps.deploy.outputs.pages-environment }}
          INTERNAL: ${{ matrix.internal }}
        run: |
          if [ -n "$INTERNAL" ]; then
            # the internal mainnet app must never become the production deployment (it would be the public site)
            if [ "$PAGES_ENV" != preview ]; then
              echo "::error::the internal app became a ${PAGES_ENV:-unknown} deployment, not a preview: it must be a preview on the branch \`internal\`, which is not the project's production branch (docs/ops/web-hosting.md 4c)"
              exit 1
            fi
          elif [ "$PAGES_ENV" != production ]; then
            echo "::error::the upload became a ${PAGES_ENV:-unknown} deployment, not production: set KOB_PAGES_BRANCH to the production branch of the Pages project (docs/ops/web-hosting.md)"
            exit 1
          fi
      # the URLs wrangler gave, for the verify job (which checks them with the hashes recorded by job build)
      - name: The deployment URLs, for the verify job
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: printf '%s\n%s\n' "$URL" "$ALIAS" > "$RUNNER_TEMP/deployment-urls.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-urls-${{ matrix.site }}
          path: ${{ runner.temp }}/deployment-urls.txt
          if-no-files-found: error
          retention-days: 7
      # the custom domain: the host of the public URL, attached to the project (and its DNS record) when that is not done yet; what the
      # token cannot do is printed as dashboard steps (docs/ops/web-hosting.md, section 5)
      - name: Custom domain of the site (the host of the public URL)
        if: matrix.public != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ matrix.project }}
          PUBLIC_URL: ${{ matrix.public }}
        run: node web/scripts/pages-domain.mjs --project "$PROJECT" --public-url "$PUBLIC_URL" | tee -a "$GITHUB_STEP_SUMMARY"

  # The post-deploy checks, on a runner of their own: no secret, no environment, read access to the repository only. The hashes are the
  # artifact of job build, which never sees the Cloudflare token, and scripts/check-pages.mjs comes from a fresh checkout of the same
  # commit, so nothing that ran beside the token can rewrite either (the deployment URLs are still wrangler's).
  verify:
    needs: [config, build, deploy]
    if: needs.config.outputs.ready == 'true' && github.ref == 'refs/heads/master'
    name: verify (${{ matrix.site }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.1" # exact and the same in every workflow (docs/ops/release.md 6)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deployed-sha256-${{ matrix.site }}
          path: ${{ runner.temp }}/handover
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deployment-urls-${{ matrix.site }}
          path: ${{ runner.temp }}/handover
      # the internal mainnet app: an unauthenticated request must meet Cloudflare Access (the project's access policy for previews), on the deployment URL and on the
      # branch alias, never the app; the job fails (and says to delete the deployment) when it is served openly
      - name: Post-deploy check of the internal app (behind Cloudflare Access, not served openly)
        if: matrix.internal != ''
        run: |
          URL=$(sed -n 1p "$RUNNER_TEMP/handover/deployment-urls.txt")
          ALIAS=$(sed -n 2p "$RUNNER_TEMP/handover/deployment-urls.txt")
          urls=()
          for u in "$URL" "$ALIAS"; do
            case "$u" in https://*) urls+=("$u") ;; esac
          done
          if [ ${#urls[@]} -lt 2 ]; then
            echo "::error::wrangler gave no https deployment and alias URL for the internal app (deployment \`$URL\`, alias \`$ALIAS\`): the protection cannot be checked"; exit 1
          fi
          set +e
          node scripts/check-pages.mjs --protected "${urls[@]}" > "$RUNNER_TEMP/check.txt" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/check.txt"
          { echo; echo "### Protection check (internal app)"; echo; echo '```'; cat "$RUNNER_TEMP/check.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Post-deploy check (headers of public/_headers, every file byte for byte against the hashes recorded before the upload steps)
        if: matrix.internal == ''
        run: |
          URL=$(sed -n 1p "$RUNNER_TEMP/handover/deployment-urls.txt")
          case "$URL" in https://*) ;; *) echo "::error::no https deployment URL from wrangler: \`$URL\`"; exit 1 ;; esac
          set +e
          node scripts/check-pages.mjs "$URL" --hashes "$RUNNER_TEMP/handover/deployed.sha256" > "$RUNNER_TEMP/check.txt" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/check.txt"
          { echo; echo "### Post-deploy check"; echo; echo '```'; cat "$RUNNER_TEMP/check.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
