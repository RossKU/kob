name: release

# Prebuilt kobd and kob (the command line, crate kob-cli) for operators (docs/ops/executor-quickstart.md): Windows x86_64 (MSVC, static CRT),
# Linux x86_64 (glibc) and Android arm64 (aarch64-linux-android, bionic: for Termux on a phone), each as the testnet-10 and the mainnet
# deployment build (docs/ops/release.md), packaged by scripts/package-release.mjs into
# kobd-<version>-<network>-<target>.zip / .tar.gz (kobd, the daemon, and kob, QUICKSTART.md, LICENSE, NOTICE and a SHA256SUMS of
# their files) and kob-<version>-<network>-<target>.zip / .tar.gz (the command line alone, with its README and REFERENCE).
# The Android app for tap-to-use phones (testnet-10 only; android.yml, called by the job `android` below) goes into the release as
# kobd-<version>-testnet-10-android.apk, with its SHA256 in the release's SHA256SUMS like the archives. It is signed with the
# release key when the ANDROID_* repository secrets exist (a new APK then updates the old one in place and keeps the key);
# without them it is debug-signed, named ...-android-debug-signed.apk, and the release notes say it cannot be updated.
#
# * A pushed tag must be v<version> of the workspace (Cargo.toml [workspace.package], which kobd and kob-cli (binary kob) inherit):
#   the version is bumped in the commit that is tagged, so --version of every binary is the tag. Any other tag fails here,
#   before anything is built (job version, scripts/package-release.mjs --check-tag).
# * A pushed tag v* builds every archive and attaches them, with a SHA256SUMS of the archives, to a DRAFT release of the tag:
#   the maintainer adds the release notes (scripts/release-hashes.sh, docs/ops/release.md 6) and publishes it.
# * workflow_dispatch is the dry run: the same builds, uploaded as workflow artifacts only (no release, no tag).
#
# No cache: a release binary is built from the commit alone (the reproducible job of ci.yml builds the executor twice and
# compares). No binary is code-signed: the Windows binary shows SmartScreen's "More info -> Run anyway" (the quickstart says so).
# Every file of a release (the archives, the APK and SHA256SUMS) carries a build provenance attestation instead: keyless Sigstore,
# signed by this workflow's GitHub identity at this commit and recorded in the repository's attestations, which
# `gh attestation verify <file> --repo RossKU/kob --signer-workflow RossKU/kob/.github/workflows/release.yml --source-ref refs/tags/<tag>` checks (docs/ops/release.md 6, executor-quickstart.md 1). It proves which
# workflow run of which commit built the file, so a file swapped in the release afterwards (with a matching SHA256SUMS) fails it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # the NDK that links the Android archive, pinned as in android.yml (installed with sdkmanager when the image lacks it)
  NDK_VERSION: "30.0.16248370"

jobs:
  version:
    # the archives' version: the tag, which must equal the workspace version; a dry run is dev-<commit>
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: The tag is v + the workspace version (a dry run is dev-<commit>)
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then v=$(node scripts/package-release.mjs --check-tag "$REF_NAME"); else v="dev-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        network: [testnet-10, mainnet]
        platform:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          # the oldest supported Ubuntu runner: the binary needs the glibc it was linked against or newer (2.35)
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          # bionic, not musl: Android has no /etc/resolv.conf (musl's resolver reads it), and bionic's getaddrinfo is what Termux uses
          - { os: ubuntu-22.04, target: aarch64-linux-android }
    runs-on: ${{ matrix.platform.os }}
    defaults:
      run:
        shell: bash
    env:
      # the Windows binary carries the C runtime, so a fresh Windows needs no Visual C++ redistributable for a double click
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master as of 2026-10-01 (the action has no release tags)
        with:
          toolchain: "1.94.0"
          targets: ${{ matrix.platform.target }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Android NDK toolchain (NDK_VERSION; clang for API 24, Android 7.0 and later)
        if: matrix.platform.target == 'aarch64-linux-android'
        run: |
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          if [ ! -x "$bin/aarch64-linux-android24-clang" ]; then
            echo "NDK $NDK_VERSION is not on the runner image: installing it"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          fi
          test -x "$bin/aarch64-linux-android24-clang" || { echo "no NDK clang under $bin" >&2; exit 1; }
          grep -q "^Pkg.Revision *= *$NDK_VERSION" "$ndk/source.properties" || { echo "$ndk is not NDK $NDK_VERSION" >&2; exit 1; }
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android24-clang"
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            # phones with 16 KB memory pages (Android 15+) refuse to load an executable aligned to 4 KB (as android.yml)
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS=-C link-arg=-Wl,-z,max-page-size=16384"
          } >> "$GITHUB_ENV"
      - name: Build kobd and kob (${{ matrix.network }} deployment build, --locked)
        env:
          NETWORK: ${{ matrix.network }}
          TARGET: ${{ matrix.platform.target }}
          # the commit /v1/health reports (docs/ops/release.md, 7); read at compile time, not a build input otherwise
          KOB_GIT_COMMIT: ${{ github.sha }}
        run: |
          case "$NETWORK" in
            mainnet) f=deploy-mainnet ;;
            testnet-10) f=deploy-tn10 ;;
          esac
          cargo build --release --locked --target "$TARGET" -p kobd -p kob-cli \
            --features "kobd/$f,kob-cli/$f"
      - name: The Android binaries are arm64 ELF (they cannot run on this x86_64 runner, so the next step does not apply to them)
        if: matrix.platform.target == 'aarch64-linux-android'
        env:
          TARGET: ${{ matrix.platform.target }}
        run: |
          for b in kobd kob; do
            file "target/$TARGET/release/$b" | tee /dev/stderr | grep -q "ELF 64-bit LSB.*ARM aarch64"
          done
      - name: The binary is the build of its network (it refuses the other one before touching a node)
        # not for aarch64-linux-android: an arm64 Android binary cannot be executed on the x86_64 runner (its network is fixed
        # by the same --features as the other targets, and the check ran for the same source on the Linux and Windows builds)
        if: matrix.platform.target != 'aarch64-linux-android'
        env:
          NETWORK: ${{ matrix.network }}
          TARGET: ${{ matrix.platform.target }}
        run: |
          ext=""; case "$TARGET" in *windows*) ext=.exe ;; esac
          bin="target/$TARGET/release/kobd$ext"
          "$bin" --version
          "$bin" setup --help > /dev/null
          other=mainnet; [ "$NETWORK" = mainnet ] && other=testnet-10
          out=$(timeout 60 "$bin" --indexer --network "$other" --data-dir "$RUNNER_TEMP/refuse" 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "this binary is the $NETWORK deployment build"
          kob="target/$TARGET/release/kob$ext"
          "$kob" --version
          out=$("$kob" book TUSD --network "$other" --indexer http://127.0.0.1:1 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "this binary is the $NETWORK deployment build"
      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
          NETWORK: ${{ matrix.network }}
          TARGET: ${{ matrix.platform.target }}
        run: node scripts/package-release.mjs --version "$VERSION" --network "$NETWORK" --target "$TARGET" --bin-dir "target/$TARGET/release" --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kobd-${{ needs.version.outputs.version }}-${{ matrix.network }}-${{ matrix.platform.target }}
          path: dist/*
          if-no-files-found: error

  android:
    # the app: the same workflow the push to master runs, without the cargo cache, with the repository's signing secrets
    needs: version
    uses: ./.github/workflows/android.yml
    with:
      fresh: true
    secrets: inherit

  release:
    # tags only: a dry run (workflow_dispatch) stops at the artifacts above
    if: github.ref_type == 'tag'
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # the build provenance attestation: the OIDC token Sigstore signs with, and the repository's attestations store
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kobd-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS of every archive and the APK
        run: node scripts/package-release.mjs --sums dist
      - name: Build provenance of every archive, the APK and SHA256SUMS (keyless Sigstore; gh attestation verify)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/kob-*
            dist/kobd-*
            dist/SHA256SUMS
      - name: Draft release of the tag with the archives, the APK and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          APK_SIGNED: ${{ needs.android.outputs.signed }}
        run: |
          notes="Prebuilt kobd (the daemon) and kob, the command line (docs/ops/executor-quickstart.md; kob-<version>-<network>-<target> holds kob alone) and the testnet-10 Android app (the .apk; quickstart 9). Check each file against SHA256SUMS, and its build provenance with: gh attestation verify <file> --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml --source-ref refs/tags/$TAG. Release hashes (scripts/release-hashes.sh): to be added before publishing."
          if [ "$APK_SIGNED" = true ]; then
            notes="$notes The APK is signed with the release key: it installs over an earlier release and keeps the app's data."
          else
            notes="$notes WARNING: the APK is debug-signed (the release signing secrets were not set when it was built): no other build can update it in place, and uninstalling it deletes the operator key and its funds. Set the secrets (scripts/make-android-keystore.mjs, quickstart 9) and build again before publishing it as the app."
          fi
          gh release create "$TAG" dist/kob-* dist/kobd-* dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "KOB $TAG" --notes "$notes"
