name: ci

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master as of 2026-10-01 (the action has no release tags)
        with:
          toolchain: "1.94.0"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master as of 2026-10-01 (the action has no release tags)
        with:
          toolchain: "1.94.0"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # vendor/silverscript is third-party code and is not linted.
      - run: >
          cargo clippy --locked --all-targets
          -p kob-protocol -p kob-wasm -p kob-executor -p kob-cli -p kob-tests -p sil2argent
          -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master as of 2026-10-01 (the action has no release tags)
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Workspace tests (harness order carrier 10 KAS, KRON template 2433)
        env:
          # the live TN10 tests (node follow, x402 end-to-end) need a reachable testnet node and mine their own funds: not for CI
          KOB_SKIP_NETWORK_TESTS: "1"
        run: cargo test --workspace --locked
      - name: Engine harness, carrier sensitivity (2 KAS = the wallet default order carrier)
        shell: bash
        run: |
          KOB_CARRIER_KAS=2 cargo test --locked -p kob-tests
          KOB_CARRIER_KAS=20 cargo test --locked -p kob-tests
      - name: Engine harness, alternate KRON template as primary
        shell: bash
        run: KOB_KRON_TPL=2732 cargo test --locked -p kob-tests --test kob_kron_adapter_tests

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master as of 2026-10-01 (the action has no release tags)
        with:
          toolchain: "1.94.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked --release -p kob-wasm --target wasm32-unknown-unknown
      - name: Vendored silverscript-lang keeps building for wasm32
        run: cargo check --locked -p silverscript-lang --target wasm32-unknown-unknown

  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master as of 2026-10-01 (the action has no release tags)
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Artifacts reproduce with silverc built from vendor/silverscript, and the Argent artifacts (argentc from the pinned upstream, contracts/argent) with them
        run: scripts/build-contracts.sh --check
      - name: Artifacts reproduce with the official silverc v1.0.0 release binary
        run: scripts/build-contracts.sh --check --upstream --no-argent
      - name: Deployment records reproduce (testnet-10, and mainnet with its pinned registry)
        run: |
          scripts/build-deploy.sh testnet-10 --check
          scripts/build-deploy.sh mainnet --check
      - name: Every pinned hash (Rust and TS pin tables, router head, examples, registry templates, docs) is in the reproduced artifacts
        run: node scripts/check-pins.mjs

  x402-sdk:
    # The TypeScript x402 SDK (packages/kob-x402): typecheck, then scripts/build-wasm.sh --test, which builds the kob-wasm node bindings,
    # replays the protocol golden vectors against them (crates/kob-wasm/tests/node) and runs the SDK tests with the wasm required
    # (KOB_REQUIRE_WASM=1: the wasm-golden test replays crates/kob-x402/vectors/golden). The SDK's copy of the router artifact id is
    # tied to kob-protocol by a kob-protocol unit test (job test).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master as of 2026-10-01 (the action has no release tags)
        with:
          toolchain: "1.94.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/kob-x402/package-lock.json
      - name: SDK typecheck
        working-directory: packages/kob-x402
        run: |
          npm ci
          npm run typecheck
      - name: kob-wasm golden vectors and SDK tests (installs wasm-bindgen-cli under target/tools)
        run: bash scripts/build-wasm.sh --install-bindgen --test

  deps:
    # Dependency policy: RustSec advisories, licences and sources (deny.toml lists every accepted advisory with its reason), and the
    # npm advisories of the three lockfiles. New advisories make this job fail until they are fixed or accepted in deny.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master as of 2026-10-01 (the action has no release tags)
        with:
          toolchain: "1.94.0"
      - name: cargo-deny 0.20.2 (crates.io, --locked)
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: cargo deny check (advisories, bans, licenses, sources)
        run: cargo deny --locked check
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: npm audit (web, packages/kob-x402, tools/wallet-gate)
        run: |
          for d in web packages/kob-x402 tools/wallet-gate; do
            echo "== $d"
            (cd "$d" && npm audit --package-lock-only --audit-level=high)
          done

  web:
    # The web app (web/): kob-wasm bindings, the official kaspa-wasm v2.1.0 SDK (fetched from the rusty-kaspa release, the npm package is
    # stale), typecheck, unit tests, production build and the offline mock-stack Playwright e2e. The real-wallet TN10 run (web/e2e-real)
    # needs browser extensions, funded keys and a reachable TN10 node: it is manual / nightly, never part of this job.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master as of 2026-10-01 (the action has no release tags)
        with:
          toolchain: "1.94.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run fetch-sdk
      - name: kob-wasm bindings (installs wasm-bindgen-cli 0.2.100 under target/tools)
        working-directory: .
        run: bash scripts/build-wasm.sh --install-bindgen --web --slim
      - run: npm run build:wasm -- --copy
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-playwright-report
          path: |
            web/test-results
            web/playwright-report
