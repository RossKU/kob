name: ci

on:
  push:
    branches: [master, main, "ci/**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master as of 2026-10-01 (the action has no release tags)
        with:
          toolchain: "1.94.0"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master as of 2026-10-01 (the action has no release tags)
        with:
          toolchain: "1.94.0"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # vendor/silverscript is third-party code and is not linted.
      - run: >
          cargo clippy --locked --all-targets
          -p kob-protocol -p kob-wasm -p kobd -p kob-cli -p kob-tests -p sil2argent
          -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master as of 2026-10-01 (the action has no release tags)
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # the budget table measurements (kob-protocol/tests/budget_table.rs, about 9 minutes of CPU) run in their own job beside this one
      - name: Workspace tests (KRON template 2433)
        if: runner.os == 'Linux'
        env:
          # the live TN10 tests (node follow, x402 end-to-end) need a reachable testnet node and mine their own funds: not for CI
          KOB_SKIP_NETWORK_TESTS: "1"
        run: >
          cargo test --workspace --locked --
          --skip compute_budget_table_is_generated_exact_and_current
          --skip wide_pad_shapes_are_measured_on_every_program
          --skip pair_shapes_are_measured_on_every_program_pair
          --skip every_pair_role_is_present_and_sufficient_on_every_program_pair
      # Windows runs what it adds beyond Linux (kobd, kob-cli, kob-x402, kob-protocol, paths and files): the script-engine
      # harness (kob-tests) and the budget table measurements are platform-independent CPU work that Linux already covers,
      # and took about 45 minutes here. A smoke set of kob-tests that read the repository's files still runs.
      - name: Workspace tests, Windows (without the engine harness and the budget table measurements)
        if: runner.os == 'Windows'
        env:
          KOB_SKIP_NETWORK_TESTS: "1"
        run: >
          cargo test --workspace --locked --exclude kob-tests --
          --skip compute_budget_table_is_generated_exact_and_current
          --skip wide_pad_shapes_are_measured_on_every_program
          --skip pair_shapes_are_measured_on_every_program_pair
          --skip every_pair_role_is_present_and_sufficient_on_every_program_pair
      - name: Engine harness smoke set, Windows (the tests that read artifacts, registries and pinned files)
        if: runner.os == 'Windows'
        run: >
          cargo test --locked -p kob-tests --test artifacts_tests --test registry_tests --test protocol_lib_tests
          --test argent_import_pin_tests --test retired_cancel_tests
      - name: "Mainnet deployment build (feature deploy-mainnet: the embedded record, the pinned registry, the network checks; docs/ops/release.md 5)"
        if: runner.os == 'Linux'
        run: cargo test --locked -p kob-protocol -p kobd --lib --features deploy-mainnet

  budget-table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master as of 2026-10-01 (the action has no release tags)
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Budget table measurements (every builder shape on every program, the generated table exact and current)
        run: cargo test --locked -p kob-protocol --test budget_table

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master as of 2026-10-01 (the action has no release tags)
        with:
          toolchain: "1.94.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked --release -p kob-wasm --target wasm32-unknown-unknown
      - name: Vendored silverscript-lang keeps building for wasm32
        run: cargo check --locked -p silverscript-lang --target wasm32-unknown-unknown

  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master as of 2026-10-01 (the action has no release tags)
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Artifacts reproduce with silverc built from vendor/silverscript, and the Argent artifacts (argentc from the pinned upstream, contracts/argent) with them
        run: scripts/build-contracts.sh --check
      - name: Artifacts reproduce with the official silverc v1.0.0 release binary
        run: scripts/build-contracts.sh --check --upstream --no-argent
      - name: Deployment records reproduce (testnet-10, and mainnet with its pinned registry)
        run: |
          scripts/build-deploy.sh testnet-10 --check
          scripts/build-deploy.sh mainnet --check
      - name: Every pinned hash (Rust and TS pin tables, router head, examples, registry templates, docs) is in the reproduced artifacts
        run: node scripts/check-pins.mjs

  x402-sdk:
    # The TypeScript x402 SDK (packages/kob-x402): typecheck, then scripts/build-wasm.sh --test, which builds the kob-wasm node bindings,
    # replays the protocol golden vectors against them (crates/kob-wasm/tests/node) and runs the SDK tests with the wasm required
    # (KOB_REQUIRE_WASM=1: the wasm-golden test replays crates/kob-x402/vectors/golden). The SDK's copy of the router artifact id is
    # tied to kob-protocol by a kob-protocol unit test (job test).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master as of 2026-10-01 (the action has no release tags)
        with:
          toolchain: "1.94.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/kob-x402/package-lock.json
      - name: SDK typecheck
        working-directory: packages/kob-x402
        run: |
          npm ci
          npm run typecheck
      - name: kob-wasm golden vectors and SDK tests (installs wasm-bindgen-cli under target/tools)
        run: bash scripts/build-wasm.sh --install-bindgen --test

  deps:
    # Dependency policy: RustSec advisories, licences and sources (.cargo/deny.toml lists every accepted advisory with its reason), and the
    # npm advisories of the three lockfiles. New advisories make this job fail until they are fixed or accepted in .cargo/deny.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master as of 2026-10-01 (the action has no release tags)
        with:
          toolchain: "1.94.0"
      - name: cargo-deny 0.20.2 (crates.io, --locked)
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: cargo deny check (advisories, bans, licenses, sources)
        run: cargo deny --locked --config .cargo/deny.toml check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: npm audit (web, packages/kob-x402, tools/wallet-gate)
        run: |
          for d in web packages/kob-x402 tools/wallet-gate; do
            echo "== $d"
            (cd "$d" && npm audit --package-lock-only --audit-level=high)
          done

  web:
    # The web app (web/): kob-wasm bindings, the official kaspa-wasm v2.1.0 SDK (fetched from the rusty-kaspa release, the npm package is
    # stale), typecheck, unit tests, production build and the offline mock-stack Playwright e2e. The real-wallet TN10 run (web/e2e-real)
    # needs browser extensions, funded keys and a reachable TN10 node: it is manual / nightly, never part of this job.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master as of 2026-10-01 (the action has no release tags)
        with:
          toolchain: "1.94.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run fetch-sdk
      - name: kob-wasm bindings (installs wasm-bindgen-cli 0.2.100 under target/tools)
        working-directory: .
        run: bash scripts/build-wasm.sh --install-bindgen --web --slim
      - run: npm run build:wasm -- --copy
      - run: npm run typecheck
      - run: npm test
      # the release bundle (vite build plus dist/registry/tokens.json, docs/ops/release.md 4)
      - run: npm run build:release
      - name: Release hashes (the deployment record reproduces, the bundle embeds and ships the registry the mainnet record pins)
        working-directory: .
        run: bash scripts/release-hashes.sh
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-playwright-report
          path: |
            web/test-results
            web/playwright-report

  reproducible:
    # The release outputs are built twice, from two checkouts at different paths (a/ and b/) with their own target and node_modules
    # directories and no cache, and every file must come out identical: the web bundle (web/dist, with the kob-wasm bindings it embeds,
    # scripts/build-wasm.sh --web --slim) and the kobd release binary. A difference means the output depends on the build
    # directory, the time or another input outside the commit (docs/ops/release.md 6).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: a
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: b
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master as of 2026-10-01 (the action has no release tags)
        with:
          toolchain: "1.94.0"
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: wasm-bindgen-cli (the Cargo.lock version, under a/target/tools; used by both builds)
        working-directory: a
        run: |
          want=$(awk '/^name = "wasm-bindgen"$/ {getline; gsub(/"/, "", $3); print $3; exit}' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$want" --locked --root "$RUNNER_TEMP/bindgen"
      - name: Build a/ and b/ (kob-wasm web bindings, web/dist, kobd release)
        env:
          WASM_BINDGEN: ${{ runner.temp }}/bindgen/bin/wasm-bindgen
        run: |
          for side in a b; do
            echo "== $side"
            (cd "$side" && bash scripts/build-wasm.sh --web --slim)
            (cd "$side/web" && npm ci && npm run fetch-sdk && npm run build:wasm -- --copy && npm run build)
            (cd "$side" && cargo build --locked --release -p kobd)
          done
      - name: Every file of web/dist and the kobd binary are identical
        run: |
          for side in a b; do (cd "$side/web/dist" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "dist-$side.sha256"; done
          wc -l < dist-a.sha256
          diff dist-a.sha256 dist-b.sha256
          sha256sum a/target/release/kobd b/target/release/kobd
          cmp a/target/release/kobd b/target/release/kobd
